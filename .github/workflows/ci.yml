name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          texlive_version: "2026"
          os: debian
          root_file: main.tex
          working_directory: .
          latexmk_use_lualatex: true
      # latex-action writes as root inside Docker; restore readability for strict PDF validation.
      - name: Restore generated output ownership
        run: sudo chown -R "$(id -u):$(id -g)" build
      - name: Validate PDF
        env:
          PDF_FILE: build/main.pdf
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf poppler-utils
          test -s "$PDF_FILE"
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"
          pdftotext "$PDF_FILE" - | grep -q '[^[:space:]]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-pdf
          path: build/main.pdf
          if-no-files-found: error
          retention-days: 14
